<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بصمة أرين | تفاصيل المقال</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap');
        :root { --gold: #d5ae65; --dark: #262721; --beige: #cbc2bb; --soft: #fdfbf9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--soft); color: var(--dark); line-height: 1.8; }
        .post-nav { background: var(--dark); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .back-btn { background: var(--gold); color: var(--dark); text-decoration: none; padding: 8px 20px; border-radius: 50px; font-weight: 700; font-size: 0.9rem; transition: 0.3s; }
        .back-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(213, 174, 101, 0.4); }
        .nav-logo { color: var(--gold); font-weight: 900; font-size: 1.2rem; }
        .container { max-width: 1000px; margin: 50px auto; padding: 0 5%; }
        .post-hero { width: 100%; height: 450px; border-radius: 30px; overflow: hidden; margin-bottom: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.1); }
        .post-hero img { width: 100%; height: 100%; object-fit: cover; }
        .post-title { font-size: 3rem; font-weight: 900; color: var(--dark); margin-bottom: 25px; line-height: 1.3; }
        .post-content { font-size: 1.2rem; color: #444; text-align: justify; }
        .post-content h2 { color: var(--gold); margin: 40px 0 20px; font-size: 2rem; border-right: 5px solid var(--gold); padding-right: 15px; }
        .post-content p { margin-bottom: 25px; }
        .highlight-box { background: rgba(213, 174, 101, 0.1); padding: 30px; border-radius: 20px; margin: 40px 0; border-right: 5px solid var(--gold); }
        @media (max-width: 768px) {
            .post-title { font-size: 1.5rem; }
            .post-content { font-size: 0.8rem; }
            .post-content h2 { font-size: 1.2rem; }
            .back-btn { padding: 5px 12px; font-size: 0.7rem; }
            .nav-logo { font-size: 0.9rem; }
            .post-hero { height: 250px; }
        }
    </style>
</head>
<body>
    <header class="post-nav">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
        <div class="nav-logo">بصمة أرين للرخام والحجر</div>
    </header>
    <div class="container">
        <div id="post-data"></div>
    </div>
    <script>
        const posts = {
            marble: {
                title: "دليل الفخامة: كيف تختار الرخام الإيطالي لمشروعك؟",
                img: "images/blog1.png",
                content: `
                    <p>يعتبر الرخام الإيطالي الطبيعي هو المعيار العالمي للفخامة والرقي في عالم التصميم المعماري. نحن في بصمة أرين نحرص على استيراد أجود الأنواع التي تتميز بصفاء اللون وتناسق العروق الطبيعية التي تشكل لوحات فنية لا تكررها الطبيعة مرتين.</p>
                    <h2>أنواع الرخام وأفضل استخداماتها</h2>
                    <p>هناك المئات من الأنواع، ولكن يظل رخام "ستواريو" و"كالاكاتا" هما المتربعان على عرش الجمال، حيث يتميزان بخلفية بيضاء ناصعة وعروق رمادية عريضة تمنح مداخل الفلل والقصور هيبة لا تضاهى. أما رخام "كريما مارفل" الإسباني فهو الخيار المثالي للباحثين عن الدفء والهدوء في غرف النوم والمجالس.</p>
                    <div class="highlight-box">نصيحة الخبراء: عند تركيب الرخام في المساحات الواسعة، احرص دائماً على اختيار تقنية "الأوبن بوك" لتظهر العروق بشكل متناظر ومبهر.</div>
                    <h2>خطوات التركيب الاحترافي لدى بصمة أرين</h2>
                    <p>عملية التركيب تبدأ بمعالجة الأرضيات وضمان استوائها، ثم استخدام غراء رخام عالي الجودة يمنع تسرب الرطوبة. بعد التركيب، تبدأ مرحلة الجلي الألماسي التي نتميز بها في جدة، حيث نستخدم 7 مراحل من التلميع حتى يصل الرخام لمرحلة انعكاس المرآة.</p>
                    <p>نحن نوفر ضماناً حقيقياً على جودة التركيب وعدم تغير الألوان، مع تقديم خطة صيانة دورية تشمل التلميع السنوي لضمان بقاء الرخام في حالته الجديدة دائماً.</p>
                `
            },
            ceramics: {
                title: "البورسلان العملاق: التكنولوجيا تلتقي بالفن الهيكلي",
                img: "images/blog2.png",
                content: `
                    <p>شهد عالم التشطيب ثورة كبيرة بظهور ألواح البورسلان ضخمة الحجم التي يطلق عليها (Slabs). هذه الألواح غيرت مفهوم الجمال، حيث تمنح المكان مظهراً متصلاً بحد أدنى من الفواصل، مما يسهل عملية التنظيف ويمنح اتساعاً بصرياً مذهلاً.</p>
                    <h2>لماذا تختار البورسلان لمشروعك؟</h2>
                    <p>يتميز البورسلان الحديث بقوة تحمل جبارة تفوق الحجر الطبيعي في مقاومة الخدوش وامتصاص السوائل. كما أنه يأتي بنقشات رخامية وخشبية تحاكي الطبيعة بدقة تصل إلى 99%، مما يجعله خياراً اقتصادياً وجمالياً في آن واحد للمطابخ والحمامات ذات الاستخدام المكثف.</p>
                    <div class="highlight-box">تنبيه تقني: تركيب الألواح الكبيرة يتطلب فنيين محترفين وأدوات شفط خاصة لضمان عدم الكسر وتوزيع الغراء بشكل متساوٍ تحت البلاطة بالكامل.</div>
                    <h2>دقة التنفيذ في بصمة أرين</h2>
                    <p>نحن نمتلك فريقاً متخصصاً في التعامل مع ألواح البورسلان التي تصل أطوالها إلى 3 أمتار. نستخدم موازين الليزر لضبط الارتفاعات بدقة مليمترية، ونحرص على استخدام فواصل التمدد الصحيحة التي تحمي الأرضيات من التشقق نتيحة تغير درجات الحرارة.</p>
                `
            },
            stone: {
                title: "تكسية الواجهات بالحجر الطبيعي: استثمار للزمن",
                img: "images/blog3.png",
                content: `
                    <p>الواجهة الخارجية هي الانطباع الأول عن المبنى، والحجر الطبيعي هو المادة الوحيدة التي تزداد جمالاً مع مرور السنين. نحن نوفر أفضل أنواع حجر الرياض والبيضاء والمنحوتات الصخرية التي تمنح مبانيكم لمسة ملكية رصينة.</p>
                    <h2>مزايا التركيب الميكانيكي للحجر</h2>
                    <p>نحن في بصمة أرين ننصح دائماً بالتركيب الميكانيكي، وهو نظام يعتمد على تثبيت الحجر بزوايا حديدية مجلفنة بعيداً عن الجدار بمسافة بسيطة. هذا الفراغ يعمل كعازل حراري طبيعي ممتاز يقلل من استهلاك الكهرباء في التبريد، كما يمنع ظهور الأملاح والرطوبة على الواجهة.</p>
                    <div class="highlight-box">معلومة ترويجية: الواجهات الحجرية تزيد من القيمة العقارية للمبنى بنسبة تصل إلى 20% مقارنة بالدهانات التقليدية.</div>
                    <h2>التصاميم الكلاسيكية والنيوكلاسيك</h2>
                    <p>فريقنا الهندسي يقوم برسم مخططات الواجهات بدقة، مع دمج الكرانيش والأعمدة المنحوتة التي نصنعها في مصانعنا الخاصة. نضمن لكم تناسق الألوان وجودة الحجر ضد التآكل والعوامل الجوية المتقلبة في المملكة.</p>
                `
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const post = posts[postId] || posts['marble'];

        document.getElementById('post-data').innerHTML = `
            <div class="post-hero"><img src="${post.img}" alt=""></div>
            <h1 class="post-title">${post.title}</h1>
            <div class="post-content">${post.content}</div>
        `;
    </script>
</body>
</html>
